name: Deploy TIE Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify SSH key secret
        run: |
          if [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "ERROR: SSH_KEY secret is empty or missing"
            exit 1
          else
            echo "SSH_KEY secret found"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: YOUR_SERVER_IP
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/tie-bot

            echo "Pulling latest changes..."
            git pull origin main

            echo "Installing dependencies..."
            npm install

            echo "Restarting bot..."
            pm2 reload tie-bot || pm2 start index.js --name tie-bot

            pm2 save
